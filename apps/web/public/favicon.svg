<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="faviconTitle faviconDesc">
  <!--
    在线聊天站点 favicon。
    以聊天气泡表达核心职责，右上角亮点表示在线状态；所有图形均为矢量，适配浏览器标签页小尺寸显示。
  -->
  <title id="faviconTitle">在线聊天图标</title>
  <desc id="faviconDesc">深色圆角背景上的青绿色聊天气泡和在线状态点。</desc>
  <defs>
    <linearGradient id="faviconBg" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10243f" />
      <stop offset="1" stop-color="#071421" />
    </linearGradient>
    <linearGradient id="bubbleFill" x1="15" y1="17" x2="49" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#14b8a6" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#faviconBg)" />
  <path
    d="M17 27.8C17 21.8 22.3 17 29 17h8c6.7 0 12 4.8 12 10.8v3.4C49 37.2 43.7 42 37 42h-6.8l-8.7 5.4c-1.3.8-2.9-.4-2.4-1.9l1.8-5.3C18.4 38.2 17 34.9 17 31.2v-3.4Z"
    fill="url(#bubbleFill)"
  />
  <path
    d="M24 29h18M24 35h12"
    fill="none"
    stroke="#ecfeff"
    stroke-width="3.8"
    stroke-linecap="round"
  />
  <circle cx="47" cy="18" r="7.5" fill="#22c55e" stroke="#071421" stroke-width="4" />
</svg>
